# Single-service compose. One command brings up the bot:
#   docker compose up -d --build
#
# The container reads /app/.env (mounted from bot/.env) and writes its
# SQLite DB to /app/data (mounted from bot/data on host).
#
# Network: we publish the bridge port to 127.0.0.1 ONLY. The Chrome
# extension running on the host reaches it via host.docker.internal:8787
# (Docker Desktop's built-in DNS for the host gateway). We deliberately
# DON'T bind to 0.0.0.0 on the host — that would expose the bridge to
# anyone on the LAN, and the shared token alone isn't enough for that
# threat model.
services:
  bot:
    build: .
    container_name: x-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      # Mount frontend as live volume — `git pull` is enough, no rebuild needed.
      # The webapp server reads HTML/CSS/JS from disk on every request, so
      # changes appear instantly. Remove `:ro` if you ever edit files inside
      # the container (you shouldn't — edit them on the host and commit).
      - ./src/webapp/frontend:/app/src/webapp/frontend:ro
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
